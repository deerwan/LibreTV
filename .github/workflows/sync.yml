name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 16 * * *" # 每天 UTC 16:00 (北京时间 00:00)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: LibreSpark/LibreTV
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sync_method: merge
          force: false
          tags: false
          pr_title: "🔄 Sync with upstream main"
          pr_body: "Automatically synced with upstream changes"
          pr_label: "sync"
          pr_assignee: ${{ github.repository_owner }}
          create_pr: true # 启用自动创建同步 PR

      - name: Sync success
        if: success()
        run: |
          echo "✅ Sync completed successfully!"
          echo "Synced commits: ${{ steps.sync.outputs.sync_commits }}"
          echo "Sync method: ${{ steps.sync.outputs.sync_method }}"

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，请检查上游仓库是否有重大变更或权限问题。"
          exit 1

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sync-logs
          path: ${{ github.workspace }}/.github/actions/sync/logs/
          retention-days: 7
    
